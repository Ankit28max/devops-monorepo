
name: Build and Push Docker Images

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/monorepo-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/monorepo-backend:latest

      - name: Build and push WebSocket
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ws
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/monorepo-ws:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/monorepo-ws:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/monorepo-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/monorepo-frontend:latest
