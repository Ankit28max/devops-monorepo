name: Continuous Deployment & Security Verification

on:
  push:
    branches:
      - main

jobs:
  security-scan:
    name: Security Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner on codebase and dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Build API container image for vulnerability scan
        run: docker build -t devops-api:${{ github.sha }} -f Dockerfile.api .

      - name: Scan API Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devops-api:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  deploy:
    name: Deploy to AWS EC2
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/devops-monorepo

            echo "Discarding any unstaged local server modifications..."
            git checkout -- .

            echo "Pulling latest code from main branch..."
            git pull origin main

            echo "Rebuilding and updating containers..."
            docker compose up -d --build

            echo "Applying Prisma database migrations..."
            docker compose exec -T api bunx prisma@5 db push --schema packages/db/prisma/schema.prisma

            echo "Pruning unused images..."
            docker image prune -f

            echo "Deployment completed successfully."
